{% extends 'base.html' %}{% block content %}<a class="back" href="{{ url_for('index') }}">← All tickets</a><span class="eyebrow">TICKET #{{ item.id }}</span><h1>{{ item.title }}</h1><div class="card form-card"><div class="meta"><span>{{ item.category }}</span><span>{{ item.priority }} priority</span><span>{{ item.created_at }} UTC</span></div><h2>Description</h2><p class="description">{{ item.description }}</p><form method="post"><label>Status<select name="status">{% for status in statuses %}<option {% if item.status == status %}selected{% endif %}>{{ status }}</option>{% endfor %}</select></label><button class="button" type="submit">Update status</button></form></div>{% endblock %}
