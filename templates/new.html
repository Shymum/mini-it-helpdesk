{% extends 'base.html' %}{% block content %}<a class="back" href="{{ url_for('index') }}">← All tickets</a><h1>New ticket</h1><p>Tell us what needs attention.</p><div class="card form-card">{% if errors %}<div class="errors" role="alert"><ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}<form method="post"><label>Title<input name="title" required minlength="3" maxlength="120" value="{{ values.get('title', '') }}" placeholder="e.g. Monitor does not turn on"></label><label>Description<textarea name="description" required minlength="10" maxlength="2000" rows="6" placeholder="Describe the issue and what you have tried">{{ values.get('description', '') }}</textarea></label><div class="grid"><label>Category<select name="category">{% for option in categories %}<option {% if values.get('category') == option %}selected{% endif %}>{{ option }}</option>{% endfor %}</select></label><label>Priority<select name="priority">{% for option in priorities %}<option {% if values.get('priority', 'Medium') == option %}selected{% endif %}>{{ option }}</option>{% endfor %}</select></label></div><button class="button" type="submit">Create ticket</button></form></div>{% endblock %}
